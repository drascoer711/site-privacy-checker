<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracecheck — Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg: #080b16; --surface: rgba(18,24,43,.78); --surface-2: #151d35; --line: rgba(164,180,225,.18); --text: #f5f7ff; --muted: #9aa8c7; --mint: #74f5ca; --blue: #7ca7ff; --yellow: #ffd166; --red: #ff7890; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 8% -10%, #243d72 0%, transparent 62%), radial-gradient(700px 500px at 100% 10%, #173d46 0%, transparent 60%), var(--bg); color: var(--text); font: 15px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--mint); text-decoration: none; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 20px 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; }
    .logo { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: linear-gradient(135deg, var(--mint), var(--blue)); color: #07101b; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .card { border: 1px solid var(--line); background: rgba(18,24,43,.78); border-radius: 18px; padding: 18px; }
    .value { font-size: 2rem; font-weight: 850; letter-spacing: -.06em; margin: 10px 0 0; }
    .label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .09em; }
    .layout { display: grid; grid-template-columns: 1.25fr .75fr; gap: 20px; margin-top: 22px; }
    .panel { border: 1px solid var(--line); background: rgba(18,24,43,.78); border-radius: 18px; padding: 18px; }
    .report-list { list-style: none; padding: 0; margin: 0; }
    .report-list li { border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02); padding: 12px 14px; margin-bottom: 10px; }
    .report-list a { color: var(--text); font-weight: 700; }
    .report-list small { display: block; color: var(--muted); }
    .chat-box { display: flex; flex-direction: column; gap: 10px; min-height: 180px; max-height: 320px; overflow: auto; padding-right: 4px; }
    .bubble { max-width: 88%; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
    .bubble.user { align-self: flex-end; background: rgba(116,245,202,.10); }
    .bubble.ai { align-self: flex-start; }
    .chat-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    .chat-form input { width: 100%; background: rgba(11,15,26,.8); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--text); }
    .chat-form button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--blue); color: #09101b; font-weight: 800; cursor: pointer; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .layout { grid-template-columns: 1fr; } }
    @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } .chat-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="brand"><span class="logo">⌁</span> tracecheck</div>
      <div>
        <a href="/">Scanner</a>
        <span class="muted"> · </span>
        <a href="/history.html">History</a>
      </div>
    </div>

    <section class="grid" id="stats-grid">
      <article class="card"><div class="label">Total scans</div><div class="value" id="total-scans">0</div></article>
      <article class="card"><div class="label">High risk</div><div class="value" id="high-risk">0</div></article>
      <article class="card"><div class="label">Avg. risk</div><div class="value" id="avg-risk">0</div></article>
      <article class="card"><div class="label">Trackers found</div><div class="value" id="tracker-count">0</div></article>
    </section>

    <section class="layout">
      <div class="panel">
        <h2>Recent reports</h2>
        <ul id="report-list" class="report-list"></ul>
      </div>

      <div class="panel">
        <h2>Dashboard AI</h2>
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" placeholder="Ask about the latest report…" autocomplete="off" />
          <button type="submit">Ask</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const reportList = document.querySelector('#report-list');
    const chatBox = document.querySelector('#chat-box');
    const chatForm = document.querySelector('#chat-form');
    const chatInput = document.querySelector('#chat-input');

    let latestReport = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function addChat(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function loadDashboard() {
      const res = await fetch('/api/history?limit=20');
      const data = await res.json();
      const reports = data.reports || [];
      latestReport = reports[0] || null;

      const totalScans = reports.length;
      const highRisk = reports.filter((r) => (r.risk?.level || 'low') === 'high').length;
      const avgRisk = totalScans ? Math.round(reports.reduce((sum, r) => sum + (r.risk?.score || 0), 0) / totalScans) : 0;
      const trackerCount = reports.reduce((sum, r) => sum + (r.findings || []).filter((f) => f.category === 'Tracker').length, 0);

      document.querySelector('#total-scans').textContent = totalScans;
      document.querySelector('#high-risk').textContent = highRisk;
      document.querySelector('#avg-risk').textContent = avgRisk;
      document.querySelector('#tracker-count').textContent = trackerCount;

      reportList.innerHTML = reports.map((report) => `
        <li>
          <a href="/report.html?id=${encodeURIComponent(report.id)}">${escapeHtml(report.url)}</a>
          <small>${escapeHtml(report.risk?.level || 'unknown')} · ${new Date(report.fetchedAt || report.createdAt).toLocaleString()}</small>
        </li>
      `).join('');

      chatBox.innerHTML = '';
      addChat('ai', latestReport ? 'AI is ready. Ask me what the latest report suggests about privacy risk, trackers, or missing security headers.' : 'No reports have been saved yet. Run a scan to populate the dashboard.');
    }

    async function askAi(question) {
      if (!latestReport) {
        addChat('user', question);
        addChat('ai', 'No report is available yet. Run a scan first so the dashboard has context.');
        return;
      }

      addChat('user', question);
      chatInput.value = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ question, summary: latestReport })
        });
        const data = await response.json();
        addChat('ai', data.answer || 'No answer returned.');
      } catch {
        addChat('ai', 'The AI assistant is currently unavailable.');
      }
    }

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = chatInput.value.trim();
      if (!value) return;
      askAi(value);
    });

    loadDashboard();
  </script>
</body>
</html>
