<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracecheck — Admin</title><style>
:root{color-scheme:dark;--bg:#080b16;--panel:#12182b;--line:#283653;--text:#f5f7ff;--muted:#9aa8c7;--mint:#74f5ca;--blue:#86aaff;--red:#ff7890}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 450px at 5% -10%,#263d78 0,transparent 62%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.brand{font-size:1.15rem;font-weight:850}.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;margin-right:9px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#07101b}a{color:var(--mint);text-decoration:none}.nav{display:flex;gap:14px;align-items:center}button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:9px;padding:9px 13px;color:var(--text);cursor:pointer}.hero h1{font-size:clamp(2.4rem,6vw,5rem);line-height:.95;letter-spacing:-.08em;margin:8px 0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.card,.panel{background:rgba(18,24,43,.84);border:1px solid var(--line);border-radius:17px;padding:18px}.label{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.74rem}.value{font-size:2.5rem;font-weight:850;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.error{color:var(--red);padding:18px}.empty{color:var(--muted);padding:24px 0}@media(max-width:760px){.stats,.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{flex-wrap:wrap}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="logo">⌁</span>tracecheck admin</div><nav class="nav"><a href="/dashboard.html">Dashboard</a><a href="/">Scanner</a><button id="logout">Sign out</button></nav></header><section class="hero"><p class="muted">OWNER CONTROL CENTER</p><h1>See the whole system.</h1><p class="muted">Account and scan summaries only. Credentials and tokens are never displayed.</p></section><section class="stats"><div class="card"><div class="label">Users</div><div class="value" id="users">—</div></div><div class="card"><div class="label">Recent reports</div><div class="value" id="reports-count">—</div></div><div class="card"><div class="label">High-risk reports</div><div class="value" id="high">—</div></div></section><section class="layout"><section class="panel"><h2>Users</h2><div id="users-list" class="table-wrap"></div></section><section class="panel"><h2>Recent reports</h2><div id="reports-list" class="table-wrap"></div></section></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=s=>document.querySelector(s);let supabase;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function start(){try{const cfg=await fetch('/api/config').then(r=>r.json());supabase=createClient(cfg.url,cfg.key);const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='/auth.html';return}const response=await fetch('/api/admin',{headers:{Authorization:`Bearer ${session.access_token}`}});const data=await response.json();if(!response.ok)throw Error(data.error);$('#users').textContent=data.totals.users;$('#reports-count').textContent=data.totals.reports;$('#high').textContent=data.reports.filter(r=>r.risk?.level==='high').length;$('#users-list').innerHTML=data.users.length?`<table><tr><th>Email</th><th>Created</th><th>Confirmed</th></tr>${data.users.map(u=>`<tr><td>${esc(u.email)}</td><td>${new Date(u.createdAt).toLocaleDateString()}</td><td>${u.confirmed?'Yes':'No'}</td></tr>`).join('')}</table>`:'<div class="empty">No users found.</div>';$('#reports-list').innerHTML=data.reports.length?`<table><tr><th>URL</th><th>Risk</th><th>Date</th></tr>${data.reports.map(r=>`<tr><td>${esc(r.url)}</td><td>${esc(r.risk?.level||'unknown')}</td><td>${new Date(r.createdAt).toLocaleString()}</td></tr>`).join('')}</table>`:'<div class="empty">No reports found.</div>'}catch(error){document.querySelector('main').innerHTML=`<div class="error">${esc(error.message||'Admin access denied.')}<br><br><a href="/dashboard.html">Back to dashboard</a></div>`}}start();$('#logout').onclick=async()=>{if(supabase)await supabase.auth.signOut();location.href='/auth.html'};</script></body></html>
