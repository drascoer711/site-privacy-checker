<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracecheck — Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b16;color:#f4f7ff;font:16px system-ui}.card{width:min(420px,calc(100% - 40px));padding:28px;border:1px solid #283653;border-radius:18px;background:#12182b}h1{margin-top:0}input,button{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #283653;box-sizing:border-box}input{background:#080b16;color:#fff}button{background:#7ca7ff;border:0;font-weight:800;cursor:pointer}.muted{color:#9aa8c7}.error{color:#ff7890;min-height:1.4em}a{color:#74f5ca}</style></head><body><main class="card"><h1>Sign in to Tracecheck</h1><p class="muted">Save scans to your account, revisit them, and keep a real AI conversation about each report.</p><form id="form"><input id="email" type="email" placeholder="Email" required autocomplete="email"><input id="password" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password"><button id="submit">Sign in</button></form><button id="toggle" type="button">Need an account? Sign up</button><p id="message" class="error"></p><p><a href="/">Back to scanner</a> · <a href="/dashboard.html">Dashboard</a></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg={url:window.__SUPABASE_URL__,key:window.__SUPABASE_ANON_KEY__};const form=document.querySelector('#form'),toggle=document.querySelector('#toggle'),submit=document.querySelector('#submit'),message=document.querySelector('#message');let signup=false;function client(){if(!cfg.url||!cfg.key)throw Error('Add SUPABASE_URL and SUPABASE_ANON_KEY to the page configuration.')}toggle.onclick=()=>{signup=!signup;submit.textContent=signup?'Create account':'Sign in';toggle.textContent=signup?'Already have an account? Sign in':'Need an account? Sign up'};form.onsubmit=async e=>{e.preventDefault();message.textContent='';try{client();const c=createClient(cfg.url,cfg.key);const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const r=signup?await c.auth.signUp({email,password}):await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;message.style.color='#74f5ca';message.textContent=signup?'Check your email to confirm your account.':'Signed in — opening dashboard…';if(!signup)setTimeout(()=>location.href='/dashboard.html',500)}catch(err){message.style.color='#ff7890';message.textContent=err.message||'Authentication failed.'}};</script></body></html>
