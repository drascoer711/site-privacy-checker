<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracecheck — Sign in</title>
  <style>
    :root{color-scheme:dark;--bg:#080b16;--panel:rgba(18,24,43,.86);--line:rgba(164,180,225,.2);--text:#f5f7ff;--muted:#a8b4d3;--mint:#74f5ca;--blue:#86aaff;--red:#ff7890}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(800px 500px at 5% -10%,#263d78 0,transparent 62%),radial-gradient(650px 480px at 100% 110%,#153d43 0,transparent 60%),var(--bg)}
    .shell{min-height:100vh;display:grid;grid-template-columns:1fr 460px;max-width:1240px;margin:auto;gap:40px;padding:28px clamp(20px,6vw,72px);align-items:center}.brand{font-weight:850;letter-spacing:-.03em;font-size:1.15rem}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;margin-right:9px;color:#07101b;background:linear-gradient(135deg,var(--mint),var(--blue))}.eyebrow{color:var(--mint);font-weight:800;letter-spacing:.14em;font-size:.75rem}.intro h1{font-size:clamp(3rem,7vw,6.5rem);line-height:.93;letter-spacing:-.08em;max-width:700px;margin:26px 0}.intro p{color:var(--muted);font-size:1.15rem;max-width:560px}.points{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.points span{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);background:rgba(255,255,255,.03)}.card{border:1px solid var(--line);background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.35);border-radius:24px;padding:28px}.card h2{font-size:1.8rem;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:var(--muted);font-size:.88rem}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#090d1b;color:var(--text);font:inherit;outline:0}.field input:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(116,245,202,.12)}button{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--mint),var(--blue));color:#07101b;margin-top:8px}button:disabled{opacity:.6;cursor:wait}.switch{background:transparent;color:var(--mint);border:1px solid var(--line);margin-top:10px}.status{min-height:25px;margin:14px 0 0;color:var(--red)}.status.ok{color:var(--mint)}.back{display:block;margin-top:22px;text-align:center;color:var(--muted);text-decoration:none}.back:hover{color:var(--mint)}
    @media(max-width:850px){.shell{grid-template-columns:1fr;max-width:560px;padding-top:34px}.intro h1{font-size:clamp(3.2rem,15vw,5rem)}.intro p,.points{display:none}.card{margin-top:4px}}
  </style>
</head>
<body><main class="shell"><section class="intro"><div class="brand"><span>⌁</span>tracecheck</div><div class="eyebrow">PRIVATE SCAN HISTORY</div><h1>Know what websites expose.</h1><p>Sign in to save your reports, revisit findings, and have a real conversation with the privacy assistant.</p><div class="points"><span>Saved reports</span><span>Personal dashboard</span><span>Evidence-based AI</span></div></section><section class="card"><h2 id="title">Welcome back</h2><p class="sub" id="subtitle">Sign in to continue to your dashboard.</p><form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required></div><button id="submit" type="submit">Sign in</button></form><button id="switch" class="switch" type="button">Need an account? Create one</button><div id="status" class="status" aria-live="polite"></div><a class="back" href="/">← Back to scanner</a></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const form=document.querySelector('#form'),email=document.querySelector('#email'),password=document.querySelector('#password'),submit=document.querySelector('#submit'),switchButton=document.querySelector('#switch'),status=document.querySelector('#status');let signup=false;function message(text,ok=false){status.textContent=text;status.className=`status${ok?' ok':''}`}switchButton.onclick=()=>{signup=!signup;document.querySelector('#title').textContent=signup?'Create your account':'Welcome back';document.querySelector('#subtitle').textContent=signup?'Start saving your privacy reports.':'Sign in to continue to your dashboard.';submit.textContent=signup?'Create account':'Sign in';switchButton.textContent=signup?'Already have an account? Sign in':'Need an account? Create one';message('')};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;message('');try{const cfg=await fetch('/api/config').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});const supabase=createClient(cfg.url,cfg.key);const result=signup?await supabase.auth.signUp({email:email.value.trim(),password:password.value}):await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(result.error)throw result.error;if(signup&&!result.data.session){message('Check your email to confirm your account.',true);return}message('Signed in. Opening dashboard…',true);setTimeout(()=>location.href='/dashboard.html',450)}catch(error){message(error.message||'Authentication failed.')}finally{submit.disabled=false}};</script></body></html>
