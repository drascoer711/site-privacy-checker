<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracecheck — Compare</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b16;
      --panel: rgba(18, 24, 43, 0.9);
      --line: rgba(164, 180, 225, 0.2);
      --text: #f5f7ff;
      --muted: #9aa8c7;
      --mint: #74f5ca;
      --blue: #86aaff;
      --yellow: #ffd166;
      --red: #ff7890;
      --shadow: 0 30px 90px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(800px 450px at 5% -10%, rgba(74, 104, 192, 0.35), transparent 58%), var(--bg);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 18px 80px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }
    .logo {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--mint), var(--blue));
      color: #07101b;
      font-weight: 900;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    a {
      color: var(--mint);
      text-decoration: none;
    }
    .card {
      background: rgba(18, 24, 43, 0.86);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .hero {
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--mint);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      letter-spacing: -0.08em;
      line-height: 0.96;
    }
    .sub {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 760px;
    }
    .input-card {
      margin-top: 22px;
      padding: 20px;
      display: grid;
      gap: 18px;
    }
    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field {
      display: grid;
      gap: 8px;
    }
    label {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 14, 22, 0.8);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: rgba(116, 245, 202, 0.7);
      box-shadow: 0 0 0 3px rgba(116, 245, 202, 0.12);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: linear-gradient(135deg, var(--mint), var(--blue));
      color: #08111c;
      font-weight: 900;
      cursor: pointer;
      font: inherit;
    }
    .status {
      min-height: 24px;
      color: var(--muted);
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }
    .summary-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18, 24, 43, 0.82);
    }
    .summary-panel h3 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }
    .summary-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      display: grid;
      gap: 8px;
    }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }
    .site-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18, 24, 43, 0.9);
      padding: 18px;
      min-height: 240px;
    }
    .site-card h3 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .risk {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .risk.high { background: rgba(255, 120, 144, 0.14); color: var(--red); }
    .risk.medium { background: rgba(255, 209, 102, 0.14); color: var(--yellow); }
    .risk.low { background: rgba(116, 245, 202, 0.15); color: var(--mint); }
    .meta {
      display: grid;
      gap: 8px;
      color: var(--muted);
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .meta strong { color: var(--text); }
    .muted { color: var(--muted); }
    @media (max-width: 820px) {
      .inputs, .summary, .results { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand"><span class="logo">⌁</span> tracecheck</div>
      <nav class="nav">
        <a href="/">Scanner</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/history.html">History</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Website comparison</div>
      <h1>Compare privacy posture side by side.</h1>
      <p class="sub">Check which site exposes more trackers, fingerprinting signals, cookie risk, and weak security headers.</p>
    </section>

    <section class="card input-card">
      <div class="inputs">
        <div class="field">
          <label for="site-a">Site A</label>
          <input id="site-a" type="text" value="example.com" placeholder="example.com" />
        </div>
        <div class="field">
          <label for="site-b">Site B</label>
          <input id="site-b" type="text" value="example.org" placeholder="example.org" />
        </div>
      </div>
      <button id="compare-btn" type="button">Compare sites</button>
      <div id="status" class="status">Enter two public websites to compare.</div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script>
    const statusEl = document.querySelector('#status');
    const resultsEl = document.querySelector('#results');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#ff7890' : '#9aa8c7';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function riskClass(level = 'low') {
      return String(level).toLowerCase() === 'high' ? 'high' : String(level).toLowerCase() === 'medium' ? 'medium' : 'low';
    }

    function summarizeHealth(report) {
      const trackerCount = (report.findings || []).filter((item) => item.category === 'Tracker').length;
      const fingerprinting = (report.findings || []).filter((item) => item.category === 'Fingerprinting').length;
      const cookieSignals = (report.cookies || []).filter((item) => item.risky).length;
      const score = report.risk?.score ?? 0;
      const headers = report.security?.present ?? 0;
      const thirdParty = (report.externalDomains || []).length;
      return {
        trackerCount,
        fingerprinting,
        cookieSignals,
        score,
        headers,
        thirdParty,
        tech: (report.technologies || []).slice(0, 5).join(', ') || 'None detected'
      };
    }

    function renderComparison(data) {
      const results = Array.isArray(data.results) ? data.results : [];
      if (!results.length) {
        resultsEl.innerHTML = '<div class="card">No comparison data available.</div>';
        return;
      }

      const summaryHtml = `
        <div class="summary-panel">
          <h3>Winner</h3>
          <p><strong>${escapeHtml(data.winnerLabel || data.winner || 'Unknown')}</strong></p>
          <ul class="summary-list">
            <li>${escapeHtml(data.reason || 'The higher-risk site is highlighted below.')}</li>
          </ul>
        </div>
        <div class="summary-panel">
          <h3>Quick read</h3>
          <ul class="summary-list">
            ${results.map((site) => `<li>${escapeHtml(site.url)}: ${escapeHtml(site.risk?.level || 'unknown')} risk, ${site.findings?.length || 0} signals, ${site.security?.present || 0}/${site.security?.total || 0} headers.</li>`).join('')}
          </ul>
        </div>
      `;

      const cardsHtml = results.map((site) => {
        const health = summarizeHealth(site);
        return `
          <article class="site-card">
            <h3>${escapeHtml(site.url)}</h3>
            <div class="risk ${riskClass(site.risk?.level)}">${escapeHtml(site.risk?.level || 'unknown')}</div>
            <div class="meta">
              <div><strong>Risk score:</strong> ${site.risk?.score ?? 0}</div>
              <div><strong>Trackers:</strong> ${health.trackerCount}</div>
              <div><strong>Fingerprinting:</strong> ${health.fingerprinting}</div>
              <div><strong>Cookies:</strong> ${health.cookieSignals}</div>
              <div><strong>Security headers:</strong> ${health.headers}/${site.security?.total ?? 0}</div>
              <div><strong>3rd parties:</strong> ${health.thirdParty}</div>
              <div><strong>Technologies:</strong> ${escapeHtml(health.tech)}</div>
            </div>
          </article>
        `;
      }).join('');

      resultsEl.innerHTML = `
        <div class="summary" style="grid-column: 1 / -1;">${summaryHtml}</div>
        ${cardsHtml}
      `;
    }

    document.querySelector('#compare-btn').addEventListener('click', async () => {
      const left = document.querySelector('#site-a').value.trim();
      const right = document.querySelector('#site-b').value.trim();
      if (!left || !right) {
        setStatus('Enter two public website URLs to compare.', true);
        return;
      }

      setStatus('Comparing both sites…');
      resultsEl.innerHTML = '';

      try {
        const response = await fetch('/api/compare', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ urls: [left, right] })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Comparison failed.');
        renderComparison(data);
        setStatus('Comparison complete.');
      } catch (error) {
        setStatus(error.message || 'The comparison failed.', true);
      }
    });
  </script>
</body>
</html>
