<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracecheck — Dashboard</title><style>body{margin:0;background:#080b16;color:#f4f7ff;font:16px system-ui}.wrap{max-width:1050px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,section{background:#12182b;border:1px solid #283653;border-radius:16px;padding:18px;margin-top:16px}.value{font-size:2rem;font-weight:800}.muted{color:#9aa8c7}a{color:#74f5ca}.reports a{display:block;padding:10px;border-bottom:1px solid #283653;color:#f4f7ff}.chat{min-height:260px;max-height:380px;overflow:auto}.bubble{padding:10px;margin:8px 0;border-radius:10px;background:#18233d}.user{text-align:right;background:#123a3a}.form{display:flex;gap:8px;margin-top:12px}.form input{flex:1;padding:12px;background:#080b16;color:white;border:1px solid #283653;border-radius:8px}.form button,button{padding:10px 14px;background:#7ca7ff;border:0;border-radius:8px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.form{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><h1>Tracecheck dashboard</h1><nav><a href="/">Scanner</a> · <button id="logout">Sign out</button></nav></div><p id="account" class="muted">Loading account…</p><div class="grid"><div class="card">Scans<div id="total" class="value">0</div></div><div class="card">High risk<div id="high" class="value">0</div></div><div class="card">Average score<div id="avg" class="value">0</div></div><div class="card">Trackers<div id="trackers" class="value">0</div></div></div><section><h2>Your saved reports</h2><div id="reports" class="reports">Loading…</div></section><section><h2>AI privacy assistant</h2><div id="chat" class="chat"></div><form id="ask" class="form"><input id="question" placeholder="Ask a follow-up about your latest scan…" autocomplete="off"><button>Ask</button></form></section></main><script>const token=localStorage.getItem('tracecheck_access_token');const headers=()=>token?{Authorization:`Bearer ${token}`}:{},chat=document.querySelector('#chat');let latest=null,conversation=[];function add(role,text){const d=document.createElement('div');d.className=`bubble ${role}`;d.textContent=text;chat.append(d);chat.scrollTop=chat.scrollHeight}async function load(){if(!token){location.href='/auth.html';return}const r=await fetch('/api/history?limit=50',{headers:headers()});if(r.status===401){location.href='/auth.html';return}const d=await r.json(),xs=d.reports||[];latest=xs[0];document.querySelector('#total').textContent=xs.length;document.querySelector('#high').textContent=xs.filter(x=>x.risk?.level==='high').length;document.querySelector('#avg').textContent=xs.length?Math.round(xs.reduce((n,x)=>n+(x.risk?.score||0),0)/xs.length):0;document.querySelector('#trackers').textContent=xs.reduce((n,x)=>n+(x.findings||[]).filter(f=>f.category==='Tracker').length,0);document.querySelector('#reports').innerHTML=xs.length?xs.map(x=>`<a href="/report.html?id=${encodeURIComponent(x.id)}">${String(x.url).replace(/[&<>]/g,'')} <small class="muted">${x.risk?.level||'unknown'} · ${new Date(x.fetchedAt||x.createdAt).toLocaleString()}</small></a>`).join(''):'<span class="muted">No scans yet.</span>';document.querySelector('#account').textContent='Signed in account · scans are private to you';add('ai',latest?'Ask follow-up questions and I will use the latest saved report plus this conversation.':'Run a scan first.')};document.querySelector('#ask').onsubmit=async e=>{e.preventDefault();const q=document.querySelector('#question').value.trim();if(!q||!latest)return;document.querySelector('#question').value='';add('user',q);conversation.push({role:'user',content:q});const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json',...headers()},body:JSON.stringify({question:q,summary:latest,conversation})}),d=await r.json();add('ai',d.answer||d.error||'No answer returned.');conversation.push({role:'assistant',content:d.answer||''})};document.querySelector('#logout').onclick=()=>{localStorage.removeItem('tracecheck_access_token');location.href='/auth.html'};load();</script></body></html>
